<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21 de Setiembre - Para Milu 🌼</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #fff8dc 0%, #ffe9a0 45%, #ffd966 100%);
        font-family: 'Segoe UI', Tahoma, sans-serif;
        overflow-x: hidden;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 16px 260px;
    }

    /* ---------- Layout: foto | carta | foto ---------- */
    .layout {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        max-width: 1000px;
        width: 100%;
        z-index: 10;
    }

    .side-photo {
        width: 200px;
        height: 320px;
        border-radius: 18px;
        overflow: hidden;
        border: 5px solid #ffd966;
        box-shadow: 0 10px 30px rgba(180, 120, 0, 0.45);
        flex-shrink: 0;
        background: #fff;
        animation: floaty 4s ease-in-out infinite alternate;
    }

    .side-photo.right { animation-delay: 2s; }

    @keyframes floaty {
        from { transform: translateY(0) rotate(-1deg); }
        to   { transform: translateY(-12px) rotate(1deg); }
    }

    .side-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* ---------- Tarjeta ---------- */
    .card {
        background: rgba(255, 255, 255, 0.94);
        border: 3px solid #ffd966;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(180, 120, 0, 0.35);
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
    }

    .card h1 {
        font-size: 1.9rem;
        color: #b8860b;
        margin-bottom: 6px;
    }

    .card h2 {
        font-size: 1rem;
        color: #c9971c;
        font-weight: normal;
        margin-bottom: 18px;
    }

    .card p {
        font-size: 1rem;
        line-height: 1.7;
        color: #5a4a1e;
        margin-bottom: 14px;
    }

    .signature {
        font-size: 1.05rem;
        color: #b8860b;
        font-weight: bold;
    }

    /* ---------- Campo de flores ---------- */
    #field {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 240px;
        z-index: 5;
        pointer-events: none;
    }

    .flower {
        position: absolute;
        bottom: -10px;
        transform-origin: bottom center;
        animation: sway 3.5s ease-in-out infinite alternate;
    }

    .flower-inner {
        transform: scale(var(--s, 1));
        transform-origin: bottom center;
    }

    @keyframes sway {
        from { transform: rotate(-4deg); }
        to   { transform: rotate(4deg); }
    }

    .head {
        position: relative;
        width: 70px;
        height: 70px;
        margin: 0 auto;
    }

    .petal {
        position: absolute;
        width: 24px;
        height: 38px;
        background: linear-gradient(180deg, #fff2a8 0%, #ffd700 70%, #f5c400 100%);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        left: 50%;
        top: 50%;
        transform-origin: 50% 100%;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); }
    .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); }
    .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); }
    .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); }
    .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); }
    .petal:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); }
    .petal:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); }

    .center {
        position: absolute;
        width: 22px;
        height: 22px;
        background: radial-gradient(circle, #ffb300, #e67e00);
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
    }

    .stem {
        width: 6px;
        height: 130px;
        background: linear-gradient(180deg, #3a9d23, #2e7d1f);
        margin: -8px auto 0;
        border-radius: 3px;
        position: relative;
    }

    .leaf {
        position: absolute;
        width: 28px;
        height: 14px;
        background: #3a9d23;
        border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
        top: 45px;
    }

    .leaf.left  { left: -24px;  transform: rotate(-35deg); }
    .leaf.right { right: -24px; transform: rotate(35deg); }

    /* ---------- Pétalos cayendo ---------- */
    .falling {
        position: fixed;
        top: -24px;
        width: 14px;
        height: 20px;
        background: radial-gradient(circle at 40% 30%, #fff3b0, #ffd700);
        border-radius: 50%;
        animation: fall linear forwards;
        z-index: 4;
        pointer-events: none;
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    /* ---------- Pantallas pequeñas: fotos debajo ---------- */
    @media (max-width: 820px) {
        .layout { flex-direction: column; }
        .side-photo { width: 160px; height: 250px; }
    }
</style>
</head>
<body>

    <div class="layout">
        <!-- Foto izquierda -->
        <div class="side-photo left">
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Jungkook_for_Dispatch_photoshoot_on_%22Idol%22_music_video_set,_19_July_2018_05.jpg?width=400" alt="JungKook">
        </div>

        <!-- Carta -->
        <div class="card">
            <h1>🌼 21 de Setiembre 🌼</h1>
            <h2>Día de las Flores Amarillas</h2>
            <p>
                Querida Milu, hoy es el día de las flores amarillas
                y esta carta es para ti. Gracias por ser mi amiga
                y por compartir mi amor por JungKook. 🐰
            </p>
            <p>Que tu día sea tan amarillo y bonito como estas flores. 🌻</p>
            <p class="signature">Te quiero, amiga 💛</p>
        </div>

        <!-- Foto derecha -->
        <div class="side-photo right">
            <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Jungkook_for_BTS_5th_anniversary_party_in_LA_photoshoot_by_Dispatch,_May_2018_01.jpg?width=400" alt="JungKook">
        </div>
    </div>

    <div id="field"></div>

    <script>
        // ---------- Campo de flores amarillas ----------
        const field = document.getElementById('field');
        const N = 16;
        for (let i = 0; i < N; i++) {
            const f = document.createElement('div');
            f.className = 'flower';
            const size = 0.6 + Math.random() * 0.7;
            f.style.left = (i * 100 / N + (Math.random() * 4 - 2)) + '%';
            f.style.animationDelay = (Math.random() * 2) + 's';
            f.style.setProperty('--s', size);
            f.innerHTML =
                '<div class="flower-inner">' +
                '  <div class="head">' +
                '    <div class="petal"></div><div class="petal"></div>' +
                '    <div class="petal"></div><div class="petal"></div>' +
                '    <div class="petal"></div><div class="petal"></div>' +
                '    <div class="petal"></div><div class="petal"></div>' +
                '    <div class="center"></div>' +
                '  </div>' +
                '  <div class="stem"><div class="leaf left"></div><div class="leaf right"></div></div>' +
                '</div>';
            field.appendChild(f);
        }

        // ---------- Pétalos cayendo ----------
        function petalFall() {
            const p = document.createElement('div');
            p.className = 'falling';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (4 + Math.random() * 4) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 9000);
        }
        setInterval(petalFall, 500);
    </script>
</body>
</html>
